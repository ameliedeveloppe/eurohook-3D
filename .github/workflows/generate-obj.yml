name: Generate OBJ

on:
  push:
    branches: [main]
    paths:
      - generate_euro_hook.py
      - .github/workflows/generate-obj.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: python generate_euro_hook.py
      - name: Commit generated OBJ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add euro_hook_200mm.obj
          git diff --cached --quiet || git commit -m "Generer euro_hook_200mm.obj"
          git push
